<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研讨会英语单词系统</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --bg: #f5f6fa;
            --text: #2f3640;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        h1, h2 { text-align: center; color: var(--text); }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        .btn-warning { background-color: #e67e22; }
        .btn-secondary { background-color: #95a5a6; }
        
        .btn-small {
            width: auto;
            padding: 8px 15px;
            margin-bottom: 0;
            font-size: 14px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        input:focus { border-color: var(--primary); outline: none; }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            margin: 15px 0 25px 0;
        }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #dcdde1;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .number-input {
            width: 80px;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            text-align: right;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            padding: 4px 8px;
            box-sizing: border-box;
        }
        .number-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .card {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            transition: background-color 0.2s;
            position: relative;
        }
        
        .word-id-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #dcdde1;
            color: #2f3640;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .hint-jp { font-size: 24px; font-weight: bold; margin-bottom: 10px; margin-top: 10px; }
        .hint-sentence { font-size: 14px; color: #7f8fa6; margin-bottom: 20px; }
        .eng-sentence { font-size: 18px; font-weight: bold; }
        
        .feedback {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .feedback.wrong {
            display: block;
            background-color: #fad390;
            color: var(--danger);
        }
        
        .progress {
            text-align: right;
            font-size: 14px;
            color: #7f8fa6;
            line-height: 1.5;
        }
        
        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: var(--danger);
            background-color: #fdedec;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .slider-label {
            font-weight: bold;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reward-text {
            font-size: 28px;
            color: #e67e22;
            font-weight: bold;
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e67e22;
            display: inline-block;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-login" class="screen active">
        <h1>研讨会英语单词系统</h1>
        <p style="text-align:center">请输入密码<br>(※研讨会通用)</p>
        <input type="password" id="password-input" placeholder="密码">
        <button class="btn" onclick="checkPassword()">登录</button>
        
        <!-- ★日本語版へ戻るリンク -->
        <a href="index.html" class="btn btn-warning" style="text-decoration: none; text-align: center; margin-top: 20px; display: block; background-color: #7f8fa6;">🇯🇵 切换至日语版 (日本語版)</a>
    </div>

    <div id="screen-loading" class="screen">
        <h2>数据加载中...</h2>
    </div>

    <div id="screen-select" class="screen">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
            <button class="btn btn-small sound-toggle-btn" style="background-color: var(--primary);" onclick="toggleSound()">🔊 声音: 开</button>
        </div>

        <h2>选择测验期数</h2>
        <div class="session-grid" id="session-buttons"></div>

        <hr style="margin: 30px 0; border: none; border-top: 2px dashed #dcdde1;">
        
        <h2>选择自定义范围</h2>
        <div style="margin-top: 15px;">
            <div class="slider-label">
                <label>起始单词 (No.)</label>
                <input type="number" id="custom-start-val" class="number-input" min="1" value="1">
            </div>
            <input type="range" id="custom-start" min="1" max="1120" value="1">
            
            <div class="slider-label">
                <label>结束单词 (No.)</label>
                <input type="number" id="custom-end-val" class="number-input" min="1" value="1120">
            </div>
            <input type="range" id="custom-end" min="1" max="1120" value="1120">
            
            <button class="btn btn-success" onclick="startCustomRange()">在此范围学习</button>
        </div>
    </div>

    <div id="screen-sub-select" class="screen">
        <div class="header-bar">
            <button class="btn btn-secondary btn-small" onclick="showScreen('screen-select')">◀ 返回</button>
        </div>
        <h2 id="sub-select-title">选择题目范围</h2>
        <div class="session-grid" id="sub-session-buttons"></div>
    </div>

    <div id="screen-test" class="screen">
        <div class="header-bar">
            <button class="btn btn-secondary btn-small" style="padding: 8px 12px;" onclick="backToSubSelect()">◀ 退出</button>
            <div id="timer-display" class="timer-display" style="margin: 0 10px; flex-grow: 1; text-align: center;"></div>
            <div style="text-align: right;">
                <button class="btn btn-small sound-toggle-btn" style="background-color: var(--primary); margin-bottom: 5px; display: inline-block;" onclick="toggleSound()">🔊 声音: 开</button>
                <div class="progress" id="progress-text"></div>
            </div>
        </div>
        
        <div class="card" id="test-card">
            <div id="word-id" class="word-id-badge"></div>
            <div class="hint-jp" id="word-jp"></div>
            <div class="hint-sentence" id="sentence-jp"></div>
            <div class="eng-sentence" id="sentence-en"></div>
        </div>
        
        <div id="feedback-area" class="feedback"></div>
        
        <input type="text" id="answer-input" placeholder="输入英语单词" autocomplete="off" autocapitalize="off" spellcheck="false">
        
        <button class="btn btn-secondary" id="idk-btn" onclick="skipQuestion()">不知道</button>
        <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">下一题 (Enter)</button>
    </div>

    <div id="screen-result" class="screen">
        <h2 id="result-title">结果</h2>
        <div id="result-message" style="text-align:center; font-size: 18px; line-height: 1.6;"></div>
        <button class="btn" id="result-action-btn"></button>
        <button class="btn" style="background-color:#7f8fa6; margin-top:20px;" onclick="showScreen('screen-sub-select')">返回范围选择</button>
    </div>
</div>

<script>
    let wordData = [];     
    let currentQueue = []; 
    let wrongQueue = [];   
    let currentQuestionIndex = 0;
    let currentWord = null;
    let roundNumber = 1;
    let isWaitingForNext = false; 
    let correctCount = 0;
    let wrongCount = 0;
    let timerInterval = null;
    let remainingTime = 0;
    let isExamMode = false;
    let isSoundEnabled = true;

    const SYSTEM_PASSWORD = " gotolab"; 
    const correctAudio = new Audio('correct.mp3');
    const wrongAudio = new Audio('wrong.mp3');

    function toggleSound() {
        isSoundEnabled = !isSoundEnabled;
        const btns = document.querySelectorAll('.sound-toggle-btn');
        btns.forEach(btn => {
            if (isSoundEnabled) {
                btn.innerHTML = '🔊 声音: 开';
                btn.style.backgroundColor = 'var(--primary)';
            } else {
                btn.innerHTML = '🔇 声音: 关';
                btn.style.backgroundColor = '#95a5a6';
            }
        });
    }

    function playCorrectSound() {
        if (!isSoundEnabled) return; 
        const soundClone = correctAudio.cloneNode();
        soundClone.play().catch(e => console.log(e));
    }

    function playWrongSound() {
        if (!isSoundEnabled) return; 
        const soundClone = wrongAudio.cloneNode();
        soundClone.play().catch(e => console.log(e));
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function checkPassword() {
        const pass = document.getElementById('password-input').value;
        if (pass === SYSTEM_PASSWORD) {
            loadData();
        } else {
            alert('密码错误');
        }
    }

    async function loadData() {
        showScreen('screen-loading');
        try {
            // ★ 中国語版のJSONを読み込むように変更
            const response = await fetch('words_ch.json?' + new Date().getTime());
            if (!response.ok) throw new Error("JSON error");
            wordData = await response.json();
            
            initSliders(); 
            generateSessionButtons();
            showScreen('screen-select');
        } catch (error) {
            alert("数据加载失败。");
            console.error(error);
        }
    }

    function initSliders() {
        const maxId = Math.max(...wordData.map(w => w.id));
        const startSlider = document.getElementById('custom-start');
        const endSlider = document.getElementById('custom-end');
        const startVal = document.getElementById('custom-start-val');
        const endVal = document.getElementById('custom-end-val');

        startSlider.max = maxId; endSlider.max = maxId; endSlider.value = maxId;
        startVal.max = maxId; endVal.max = maxId; endVal.value = maxId;

        startSlider.addEventListener('input', () => {
            if (parseInt(startSlider.value) > parseInt(endSlider.value)) {
                endSlider.value = startSlider.value;
                endVal.value = endSlider.value;
            }
            startVal.value = startSlider.value;
        });

        endSlider.addEventListener('input', () => {
            if (parseInt(endSlider.value) < parseInt(startSlider.value)) {
                startSlider.value = endSlider.value;
                startVal.value = startSlider.value;
            }
            endVal.value = endSlider.value;
        });

        startVal.addEventListener('change', () => {
            let val = parseInt(startVal.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > maxId) val = maxId;
            if (val > parseInt(endVal.value)) { endVal.value = val; endSlider.value = val; }
            startVal.value = val; startSlider.value = val;
        });

        endVal.addEventListener('change', () => {
            let val = parseInt(endVal.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > maxId) val = maxId;
            if (val < parseInt(startVal.value)) { startVal.value = val; startSlider.value = val; }
            endVal.value = val; endSlider.value = val;
        });
    }

    function generateSessionButtons() {
        const container = document.getElementById('session-buttons');
        container.innerHTML = '';
        const sessions = [...new Set(wordData.map(w => w.session))].sort((a, b) => a - b);
        
        sessions.forEach(sessionNum => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = `第${sessionNum}期`;
            btn.onclick = () => showSubSelect(sessionNum);
            container.appendChild(btn);
        });
    }

    function startCustomRange() {
        const startId = parseInt(document.getElementById('custom-start-val').value);
        const endId = parseInt(document.getElementById('custom-end-val').value);
        const customWords = wordData.filter(w => w.id >= startId && w.id <= endId);
        
        if(customWords.length === 0) {
            alert("未找到所选范围内的单词。");
            return;
        }
        showSubSelect(null, customWords, startId, endId);
    }

    function showSubSelect(sessionNum = null, customWords = null, minId = null, maxId = null) {
        const container = document.getElementById('sub-session-buttons');
        container.innerHTML = '';
        
        let targetWords;
        if (customWords) {
            targetWords = customWords;
            document.getElementById('sub-select-title').innerText = `自定义范围 (No.${minId}〜${maxId})`;
        } else {
            targetWords = wordData.filter(w => w.session === sessionNum);
            document.getElementById('sub-select-title').innerText = `第${sessionNum}期 - 选择范围`;
        }

        if (!customWords) {
            const chunkSize = 20;
            const numChunks = Math.ceil(targetWords.length / chunkSize);
            for (let i = 0; i < numChunks; i++) {
                const chunk = targetWords.slice(i * chunkSize, (i + 1) * chunkSize);
                if (chunk.length === 0) continue;
                const chunkMin = chunk[0].id;
                const chunkMax = chunk[chunk.length - 1].id;
                
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = `${chunkMin}〜${chunkMax} <br><span style="font-size: 13px; font-weight:normal;">(${chunk.length}个单词)</span>`;
                btn.onclick = () => startRound(chunk, 1, false, false);
                container.appendChild(btn);
            }
        }
        
        const testBtnNormal = document.createElement('button');
        testBtnNormal.className = 'btn btn-warning';
        testBtnNormal.style.gridColumn = '1 / -1';
        testBtnNormal.style.marginTop = '10px';
        testBtnNormal.innerHTML = `📚 模拟测试 <span style="font-size: 14px; font-weight:normal;">(共${targetWords.length}词 / 含复习)</span>`;
        testBtnNormal.onclick = () => startRound(targetWords, 1, false, false);
        container.appendChild(testBtnNormal);

        if (!customWords) {
            const examBtn = document.createElement('button');
            examBtn.className = 'btn btn-danger';
            examBtn.style.gridColumn = '1 / -1';
            examBtn.innerHTML = `👑 正式测试 <span style="font-size: 14px; font-weight:normal;">(共${targetWords.length}词 / 3分钟限时 / 奖金模式)</span>`;
            examBtn.onclick = () => startRound(targetWords, 1, true, true);
            container.appendChild(examBtn);
        }
        showScreen('screen-sub-select');
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function backToSubSelect() {
        clearInterval(timerInterval);
        showScreen('screen-sub-select');
    }

    function startRound(words, round, useTimer = false, isExam = false) {
        clearInterval(timerInterval); 
        isExamMode = isExam; 
        currentQueue = shuffleArray([...words]);
        wrongQueue = [];
        currentQuestionIndex = 0;
        roundNumber = round;
        correctCount = 0;
        wrongCount = 0;
        
        const timerDisplay = document.getElementById('timer-display');
        
        if (useTimer) {
            remainingTime = 180; 
            timerDisplay.style.display = 'block';
            updateTimerUI();
            timerInterval = setInterval(() => {
                remainingTime--;
                updateTimerUI();
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    handleTimeUp();
                }
            }, 1000);
        } else {
            timerDisplay.style.display = 'none';
        }
        showScreen('screen-test');
        displayQuestion();
    }

    function updateTimerUI() {
        const m = Math.floor(remainingTime / 60).toString().padStart(2, '0');
        const s = (remainingTime % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱ ${m}:${s}`;
    }

    function handleTimeUp() {
        if (!isExamMode) {
            for (let i = currentQuestionIndex; i < currentQueue.length; i++) {
                if (!wrongQueue.includes(currentQueue[i])) {
                    wrongQueue.push(currentQueue[i]);
                    wrongCount++;
                }
            }
            alert("⏳ 时间到！\n剩下的题目将作为错误记入下一轮。");
        } else {
            alert("⏳ 时间到！\n测试结束，请查看结果。");
        }
        finishRound();
    }

    function updateProgressUI() {
        const total = currentQueue.length;
        const current = Math.min(currentQuestionIndex + 1, total);
        let roundText = isExamMode ? "" : `轮次: ${roundNumber} | `;
        
        document.getElementById('progress-text').innerHTML = 
            `${roundText}题目: ${current} / ${total}<br>` +
            `<span style="color: var(--success); font-weight: bold;">⭕️ 正确: ${correctCount}</span> | ` +
            `<span style="color: var(--danger); font-weight: bold;">❌ 错误: ${wrongCount}</span>`;
    }

    function displayQuestion() {
        if (currentQuestionIndex >= currentQueue.length) {
            clearInterval(timerInterval);
            finishRound();
            return;
        }

        currentWord = currentQueue[currentQuestionIndex];
        isWaitingForNext = false;
        
        updateProgressUI();
        
        document.getElementById('word-id').innerText = `No. ${currentWord.id}`;
        document.getElementById('word-jp').innerText = currentWord.meaning;
        document.getElementById('sentence-jp').innerText = currentWord.sentence_jp;
        document.getElementById('sentence-en').innerText = currentWord.sentence;
        
        const input = document.getElementById('answer-input');
        input.value = '';
        input.style.display = 'block';
        input.style.borderColor = '#dcdde1';
        input.focus();
        
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('idk-btn').style.display = 'block'; 
        document.getElementById('next-btn').style.display = 'none'; 
        document.getElementById('test-card').style.backgroundColor = 'var(--bg)';
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            if (isWaitingForNext) nextQuestion();
            else checkAnswer();
        }
    });

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = input.value.trim().toLowerCase();
        const correctAnswer = currentWord.word.trim().toLowerCase();
        
        if (userAnswer === correctAnswer) {
            playCorrectSound();
            correctCount++;
            updateProgressUI();
            
            const card = document.getElementById('test-card');
            input.style.borderColor = 'var(--success)';
            card.style.backgroundColor = '#e8f8f5'; 
            document.getElementById('idk-btn').style.display = 'none'; 
            
            setTimeout(() => {
                currentQuestionIndex++;
                displayQuestion();
            }, 100); 
        } else {
            handleWrongAnswer(userAnswer);
        }
    }

    function skipQuestion() {
        handleWrongAnswer("(无回答)");
    }

    function handleWrongAnswer(userAnswer) {
        isWaitingForNext = true;
        playWrongSound(); 
        
        if (!wrongQueue.includes(currentWord)) {
            wrongQueue.push(currentWord);
            wrongCount++;
            updateProgressUI();
        }

        const input = document.getElementById('answer-input');
        const card = document.getElementById('test-card');
        const feedbackArea = document.getElementById('feedback-area');

        input.style.borderColor = 'var(--danger)';
        card.style.backgroundColor = '#fdedec'; 
        
        feedbackArea.className = 'feedback wrong';
        feedbackArea.innerHTML = `正确答案: <span style="font-size:24px;">${currentWord.word}</span><br><span style="font-size:14px; color:#7f8fa6;">你的输入: ${userAnswer}</span>`;
        feedbackArea.style.display = 'block';
        
        input.style.display = 'none';
        document.getElementById('idk-btn').style.display = 'none'; 
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
        nextBtn.className = 'btn btn-danger';
        nextBtn.focus();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        displayQuestion();
    }

    function finishRound() {
        showScreen('screen-result');
        const title = document.getElementById('result-title');
        const message = document.getElementById('result-message');
        const actionBtn = document.getElementById('result-action-btn');

        if (isExamMode) {
            const calculatedScore = (correctCount * 80) - (wrongCount * 20);
            const finalScore = Math.max(0, calculatedScore);
            
            title.innerText = "🏁 正式测试结束！";
            title.style.color = "var(--primary)";
            
            message.innerHTML = `
                【结果公布】<br>
                <span style="color: var(--success); font-weight: bold;">⭕️ 正确: ${correctCount} 题</span><br>
                <span style="color: var(--danger); font-weight: bold;">❌ 错误: ${wrongCount} 题</span><br>
                <span style="font-size: 13px; color: #7f8fa6;">(※未回答的题目不计入)</span><br>
                <div class="reward-text">获得奖金: ${finalScore} 日元</div><br>
                <span style="font-size: 14px; color: #7f8fa6;">(正确+80 / 错误-20)</span>
            `;
            actionBtn.style.display = 'none';
        } else {
            if (wrongQueue.length === 0) {
                title.innerText = "🎉 全部正确！";
                title.style.color = "var(--success)";
                message.innerHTML = `太棒了！<br>您已完美掌握该范围的单词。`;
                actionBtn.style.display = 'none';
            } else {
                title.innerText = "还需要努力！";
                title.style.color = "var(--danger)";
                message.innerHTML = `还有 <strong>${wrongQueue.length} 个</strong> 错误的单词。<br>仅对错误的单词开始第 ${roundNumber + 1} 轮复习。`;
                actionBtn.style.display = 'block';
                actionBtn.className = 'btn btn-danger';
                actionBtn.innerText = `开始第 ${roundNumber + 1} 轮复习`;
                actionBtn.onclick = () => startRound(wrongQueue, roundNumber + 1, false, false);
            }
        }
    }

    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkPassword();
    });
</script>

</body>
</html>
